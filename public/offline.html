<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Simple Chat</title>
    <style>
      body {
        margin: 0;
        /* dvh is Chrome 108+; older Androids stop at the plain vh line. */
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        gap: 0.5rem;
        text-align: center;
        padding: 2rem;
        background: #0b1020;
        color: #eef2ff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      p { color: #93a1c4; margin: 0.25rem 0 1.5rem; }
      a {
        color: #0b1020;
        background: #5b8cff;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Simple Chat needs a connection to load messages.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
