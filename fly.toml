# `app` must match the name you made with `fly apps create`.
# `primary_region` is the airport code nearest your users; "sin" is Singapore.
# `fly platform regions` lists them all.
#
# Prefer `fly apps create` over `fly launch` here: launch regenerates this file
# and can drop the release command and the scale-to-zero setting below.
app = "simple-chat-dewa"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies db/schema.sql before the new version takes traffic.
  release_command = "node scripts/migrate.mjs"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Scale to zero when nobody is using it. The app closes its live stream when
  # the tab is hidden, so an idle phone does not hold the machine awake.
  # Suspend (rather than stop) keeps the wake-up fast.
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
